<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>赛博朋克鲸鱼 · 循环接缝故障预览</title>
<style>
  html, body{ margin:0; height:100%; overflow:hidden; background:#07070f;
    color:#9fd8ff; font:13px/1.7 ui-monospace, 'Cascadia Code', 'Courier New', monospace; }
  #c{ position:fixed; inset:0; width:100%; height:100%; }
  .hud{ position:fixed; top:12px; left:12px; z-index:2; max-width:320px;
    background:rgba(5,8,18,.72); border:1px solid rgba(0,240,255,.35);
    border-radius:8px; padding:10px 12px; box-shadow:0 0 24px rgba(0,240,255,.12);
    pointer-events:none; }
  .hud h1{ font-size:13px; margin:0 0 6px; color:#00f0ff; letter-spacing:1px; }
  .hud p{ margin:2px 0; }
  .dim{ opacity:.55; }
  .controls{ pointer-events:auto; margin-top:8px; }
  .btn{ border:1px solid rgba(0,240,255,.4); background:transparent; color:#7adfff;
    border-radius:6px; padding:3px 10px; margin-right:6px; cursor:pointer; font:inherit; }
  .btn:hover{ background:rgba(0,240,255,.12); }
  .seam{ position:fixed; top:12px; right:12px; z-index:2; text-align:right;
    background:rgba(5,8,18,.6); border:1px solid rgba(255,46,166,.3); border-radius:8px;
    padding:6px 10px; pointer-events:none; }
  .seam b{ color:#ff2ea6; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <h1>// CYBER-WHALE · LOOP-SEAM GLITCH</h1>
  <p>动画一圈 <b><span id="loop">?</span>s</b> · 每圈接缝自动爆一次故障</p>
  <p class="dim">正常 = 渐变鲸<br/>
    接缝 = 白闪 + RGB 色差 + 切片撕裂 + 品红残影 + 掉帧 + 噪点</p>
  <p class="dim">故障把「末帧 → 首帧」的位置跳变盖住（曲线救国）</p>
  <div class="controls">
    <button class="btn" id="toggle">关闭故障</button>
    <button class="btn" id="burst">手动爆一次</button>
    <button class="btn" id="denser">让撕裂更狠</button>
  </div>
</div>
<div class="seam">距下次接缝 <b id="next">-</b>s</div>

<script type="module">
  import { createWhaleCanvas } from './src/engine/whale-canvas.js';
  import { WHALE_ASCII_FRAMES } from './src/engine/whale-ascii-frames.js';

  const LOOP = WHALE_ASCII_FRAMES.length / 6;
  document.getElementById('loop').textContent = LOOP.toFixed(1);

  const canvas = document.getElementById('c');
  const whale = createWhaleCanvas(canvas, {
    swim: true, swimSpeed: 1.2,
    glitch: {
      enabled: true, burstWidth: 0.06, intensity: 1,
      rgbSplit: 26, slices: 8, maxShift: 56,
      flash: true, ghost: true, flicker: true,
      scanlines: false, sliceEdges: false, noise: 0.5, vBars: false,
    },
  });

  // ------ 控制面板 ------
  let on = true;
  document.getElementById('toggle').addEventListener('click', () => {
    on = !on;
    whale.setConfig({ glitch: { enabled: on } });
    document.getElementById('toggle').textContent = on ? '关闭故障' : '开启故障';
  });
  document.getElementById('burst').addEventListener('click', () => whale.pokeBurst(1));
  document.getElementById('denser').addEventListener('click', () => {
    whale.setConfig({ glitch: { maxShift: 100, rgbSplit: 44, slices: 5, noise: 0.8, vBars: false, scanlines: false, sliceEdges: false } });
    whale.pokeBurst(1);
  });

  // ------ 接缝倒计时（镜像引擎起点） ------
  const t0 = performance.now();
  const next = document.getElementById('next');
  function tick() {
    const s = ((performance.now() - t0) / 1000) % LOOP;
    const remain = LOOP - s;
    next.textContent = remain < 1 ? remain.toFixed(2) : remain.toFixed(1);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
